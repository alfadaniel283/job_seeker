services:
  # ============================================
  # WEB SERVICE - Django Application
  # ============================================
  - type: web
    name: ai-job-seeker
    runtime: python
    plan: free
    
    # Build and Start Commands
    buildCommand: ./build.sh
    startCommand: gunicorn job_seeker.wsgi:application
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
        
      - key: DJANGO_SECRET_KEY
        generateValue: true
        
      - key: DEBUG
        value: "false"
        
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
        
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-seeker-db
          property: connectionString
      
      # AI Provider Keys - Set these in Render Dashboard
      - key: GROQ_API_KEY
        sync: false
      
      - key: OPENAI_API_KEY
        sync: false
      
      - key: ANTHROPIC_API_KEY
        sync: false
      
      - key: GOOGLE_API_KEY
        sync: false
      
      # Admin user - Set these in Render Dashboard (used by create_admin command)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      
      # AI Provider Selection
      - key: AI_PROVIDER_PREFERENCE
        value: groq
      
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      
      - key: AI_TEMPERATURE
        value: "0.3"
      
      - key: AI_MAX_TOKENS
        value: "2000"
      
      # Job Fetching Settings
      - key: REQUEST_TIMEOUT
        value: "120"
      
      - key: MAX_RETRIES
        value: "10"
      
      - key: USER_AGENT
        value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# ============================================
# POSTGRESQL DATABASE
# Must be its own top-level list, separate from services
# ============================================
databases:
  - name: ai-job-seeker-db
    plan: free
    ipAllowList: []  # Allow only internal connections